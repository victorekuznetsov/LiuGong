							parent.location.href = "/login/welcome?again=true&RelayState=" + status;
						}
					);
				} catch (e) {

				}
			}

		//cookies保存
		function SetCookie(name, value, expires) {
			var argv = SetCookie.arguments;
			var argc = SetCookie.arguments.length;
			var expires = (argc > 2) ? argv[2] : null;
			var path = (argc > 3) ? argv[3] : null;
			var domain = (argc > 4) ? argv[4] : null;
			var secure = (argc > 5) ? argv[5] : false;
			document.cookie = name + "=" + escape(value)
					+ ((expires == null) ? "" : ("; expires=" + expires.toGMTString()))
					+ ((path == null) ? "" : ("; path=" + path))
					+ ((domain == null) ? "" : ("; domain=" + domain))
					+ ((secure == true) ? "; secure" : "");
		}
		
		
		// 根据appName获取 cs _mess方式信息 调控件登录
		function cs_messs(appName,user,pwd){
			document.getElementById("myRoleModal").style.display='none';
			//$("#myRoleModal").modal('hide');
			var userAndPwd = "";
			if(user.indexOf(';') >= 0){
				userAndPwd = $("input[name=certsel]:checked").val() ;
				if(userAndPwd == null || userAndPwd == ""){
					swal("",$.i18n.prop("please_select_user"),"info") ;
					return ;
				}
				user = userAndPwd.split(";")[0];
				pwd = userAndPwd.split(";")[1];
			}
			
			
			if(apass == false){
				swalShow($.i18n.prop("password_expired_please_update"), $.i18n.prop("password_expired_please_update"), "warning");
				return ;
			}
			$.ajax({
				url: gatewayurl+"/portalmanager/get/CSSSOConfig/testCSSS/3.0",
				type:'post',
				dataType:'json',
				data:'appName='+appName+"&testUser="+user+"&testPassword="+pwd,
				success:function(jsonObj){
					if(jsonObj.flag==1){
						swalShow("",$.i18n.prop("server_exception"),"error");
						return ;
					}else if(jsonObj == "redirect@login#localtion"){ // session 过期重定向到登录页
						parent.location.href = "/login/welcome";
					}else if(jsonObj.flag==2){
						swalShow("",jsonObj.error,"error");
						return ;
					}else if(jsonObj.flag==0){
						var csVO = jsonObj.csVO ;
		        		var title = csVO.title ;
		        		var toolFormat = csVO.toolFormat;
		        		var toolMessage = csVO.toolMessage;
		        		var	path = csVO.url;
		        		var param = jsonObj.param;
		        		var failHandle = csVO.failHandle;
		        		var failType = csVO.failType;
		        		var failEigen = csVO.failEigen;
		        		var failEigenvalue = csVO.failEigenvalue;
		        		cslogin_message(appName,path,param,title,failHandle,failType,failEigen,failEigenvalue,toolFormat,toolMessage,title);
					};
				},
				error:function(){
					swalShow("",$.i18n.prop("request_timed_out_please_refresh_try_again"),"error");
				}
			})
		}
