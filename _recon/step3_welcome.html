		// 关闭输入密码弹框， 获取输入值
		$("#chekCode").click(function (){
		    var authCode = $("#authCode").val();
		    if(authCode == ""){
		   	 	swal({ title : "", text : "请输入登录密码" , type : "warning" });
		   	 	return;
		    }
		    $("#checkCodeModal").modal("hide");
		    var id = $("#authid").val();
		    
		  	//sm3加密
			var dataBy = Hex.utf8StrToBytes(authCode);
			var sm3 = new SM3Digestt();
			sm3.update(dataBy,0,dataBy.length);//数据很多的话，可以分多次update
			var sm3Hash = sm3.doFinal();//得到的数据是个byte数组
			var sm3HashHex = Hex.encode(sm3Hash,0,sm3Hash.length);//编码成16进制可见字符
			authCode = sm3HashHex;
			
			//sm2加密
			if(pwdflag==1){
				var password = CryptoJS.enc.Utf8.parse(authCode);
			    var pubkeyHex = "0487997a974768450f7e0d75db6a897b4460ecd1d3ca935dd9ce14465b55ed617218eb911beb86c8cb6a78e753b1168f4b4800803585a6f5924b7063ea8ba22c8f";
			    if (pubkeyHex.length > 130) {
			        pubkeyHex = pubkeyHex.substr(pubkeyHex.length - 130);
			    }
			    var cipher = new SM2Cipher("1");
			    var userKey = cipher.CreatePoint(pubkeyHex);
				password = cipher.str2Bytes(password.toString());
				$("input[name=passwordsm2]").val(cipher.Encrypt(userKey, password));
			}
			
			document.login_form.otherPwd.value = authCode;
			if(id ==  "netPassIsneedPwd") {
				login1();
			}
			if(id ==  "faceIsneedPwd") {
				loginface()
			}
		 	if(id ==  "ukIsneedPwd") {
		 		loginCert();
			}
		});

			var contactinfo = $("#username").val();
			if(contactinfo == "" || contactinfo == undefined ){

				$("input[name='registerJsonVo[3].value']"));

			}
			sendValidCode(contactinfo);
		});
		function sendValidCode(contactinfo){
			$.get(gatewayurl+"/sms/login/sendCode", {'contactinfo': contactinfo,"sendType" : "sms"}, function(data) {
				if (data.result) {
					if(sendType == "sms"){
	   					time1(document.getElementById("sendCode"));
	   					swal("", $.i18n.prop("sms_verificationcode_send_success"), "success");
					}else{
						time1(document.getElementById("sendCode"));
			   			swal("", $.i18n.prop("email_verificationcode_send_success"), "success");
					}
				} else {
					document.getElementById("sendCode").removeAttribute("disabled");
					swal("", data.msg, "info");
   				}
   			});
		}
		//验证码倒计时
		var wait=600;  
		function time1(o) { 
	        if (wait == 0) {  
	            o.removeAttribute("disabled");            
	            o.value=$.i18n.prop("send_code");  
	            wait = 600;  
	        } else {  
	            o.setAttribute("disabled", true);
	            o.setAttribute("style", "width: 116px; margin-left: -1px; position: absolute;");
	            o.value=$.i18n.prop("re_send")+"(" + wait + "s)";  
	            wait--;  
	            setTimeout(function() {
	                time1(o)  
	            },  
	            1000)  
	        }
		};
