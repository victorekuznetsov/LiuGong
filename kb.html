<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний LiuGong — парк АО «Полюс»</title>
<link rel="icon" href="brand/razvitie-mark.svg">
<link rel="stylesheet" href="styles.css?v=1">
<link rel="stylesheet" href="catalog.css?v=1">
<link rel="stylesheet" href="liugong.css?v=1">
<link rel="stylesheet" href="kb.css?v=1">
<script>
  (function(){try{
    var t=localStorage.getItem("liugong_theme");
    if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    document.documentElement.setAttribute("data-theme",t);
  }catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
</head>
<body>

<div class="contacts">
  По вопросам работы базы знаний, ошибок и замечаний обращаться к
  Кузнецову&nbsp;В.Е. <a href="mailto:KuznetsovVE@industrservice.ru">KuznetsovVE@industrservice.ru</a>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-logo" aria-label="Развитие">
      <img class="logo-light" src="brand/razvitie-light.svg" alt="Развитие" width="82" height="34">
      <img class="logo-dark"  src="brand/razvitie-dark.svg"  alt="Развитие" width="82" height="34">
    </span>
    <div class="brand-text">
      <div class="brand-title">База знаний LiuGong</div>
      <div class="brand-sub">детали · узлы · машины · парк · темы</div>
    </div>
  </div>
  <nav class="kb-nav" id="kb-nav">
    <a href="index.html">Каталог</a>
    <a href="#/kb">База знаний</a>
    <a href="#/parts">Детали</a>
    <a href="#/machines">Машины</a>
    <a href="#/fleet">Парк</a>
    <a href="#/topics">Темы</a>
  </nav>
  <div class="search-box">
    <input id="search" type="search" autocomplete="off"
           placeholder="Номер детали или наименование…">
    <button id="search-clear" class="btn-plain" title="Очистить">✕</button>
  </div>
  <div class="topbar-tools">
    <div class="lang-switch" id="lang-switch" title="Язык наименований">
      <button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">РУС</button>
    </div>
    <button id="theme-toggle" class="btn-icon" title="Светлая / тёмная тема" aria-label="Переключить тему">
      <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5 5l1.8 1.8M17.2 17.2 19 19M19 5l-1.8 1.8M6.8 17.2 5 19"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M21 13.2A8.5 8.5 0 1 1 10.8 3 6.8 6.8 0 0 0 21 13.2Z"/>
      </svg>
    </button>
  </div>
</header>

<div id="kb-root" class="kb-root"></div>

<script src="books.js?v=1"></script>
<script src="fleet.js?v=1"></script>
<script src="codes.js?v=1"></script>
<script src="data/kb_meta.js?v=1"></script>
<script src="data/kb_machines.js?v=1"></script>
<script src="data/kb_topics.js?v=1"></script>
<script src="data/kb_parts.js?v=1"></script>
<script src="kb.js?v=1"></script>
</body>
</html>
